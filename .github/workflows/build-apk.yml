name: Convert PWA to Release AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor & Splash Screen Plugin
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/splash-screen

      - name: Bundle Web Files
        run: |
          mkdir www
          rsync -av --exclude='.git' --exclude='.github' --exclude='www' ./ www/

      - name: Create Capacitor Config Safely
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.safitech.app",
            "appName": "Safitech",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 3000,
                "launchAutoHide": true,
                "backgroundColor": "#001a66",
                "androidSplashResourceName": "splash",
                "androidScaleType": "CENTER_CROP",
                "splashFullScreen": true,
                "splashImmersive": true,
                "showSpinner": false
              }
            }
          }
          EOF

      - name: Initialize & Sync Android Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Target API Level 36 (Fix Google Play Error)
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
          fi
          sed -i 's/targetSdkVersion .*/targetSdkVersion 36/' android/app/build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle

      - name: Set App Version Code
        run: |
          # Robustly replacing versionCode to 4 to bypass previous Google Play rejections
          sed -i 's/versionCode [0-9]*/versionCode 4/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.4"/' android/app/build.gradle

      - name: Fix Android Hardware Back Button
        run: |
          mkdir -p android/app/src/main/java/com/safitech/app
          cat << 'EOF' > android/app/src/main/java/com/safitech/app/MainActivity.java
          package com.safitech.app;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onBackPressed() {
                  if (this.bridge != null && this.bridge.getWebView() != null && this.bridge.getWebView().canGoBack()) {
                      this.bridge.getWebView().goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Setup App Icon
        run: |
          if [ -f s.png ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            find android/app/src/main/res -name "ic_launcher*.xml" -type f -delete
            for dir in android/app/src/main/res/mipmap-*/; do
              cp -f s.png "${dir}ic_launcher.png" 2>/dev/null || true
              cp -f s.png "${dir}ic_launcher_round.png" 2>/dev/null || true
            done
          fi

      - name: Fix Kotlin Clashes
        run: |
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Base64 Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks

      - name: Configure Signing in Gradle
        run: |
          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file('release.jks')
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF

      - name: Build Signed Release AAB
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Move & Rename AAB Output
        run: mv android/app/build/outputs/bundle/release/app-release.aab safitech.aab

      - name: Upload Signed Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: safitech-aab
          path: safitech.aab
